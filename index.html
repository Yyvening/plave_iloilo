<!DOCTYPE html>
<html>
<head>
  <title>PLAVE Iloilo Survey</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f7ff;
      padding: 30px;
      color: #1f2937;
    }

    .card {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .desc {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      margin-top: 15px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .primary {
      background: #6d7cff;
      color: white;
    }

    .ghost {
      background: transparent;
      border: 1px dashed #6d7cff;
      color: #6d7cff;
    }

    .step {
      display: none;
    }

    .active {
      display: block;
    }

    /* Progress */
    .progress {
      margin: 10px 0 20px;
    }

    .progress-text {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 33%;
      background: #6d7cff;
      transition: 0.3s ease;
    }

    /* Checkbox pills */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      font-size: 13px;
      cursor: pointer;
      background: white;
    }

    .pill input {
      display: none;
    }

    .pill:has(input:checked) {
      background: #6d7cff;
      color: white;
      border-color: #6d7cff;
    }

    #thankyou {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>PLAVE Iloilo Survey 💙💜🩷❤️🖤</h1>
  <div class="desc">Help us plan better fan events for PLLIs in Iloilo</div>

  <!-- PROGRESS -->
  <div class="progress">
    <div class="progress-text" id="progressText">Step 1 of 3</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- STEP 1 -->
  <div id="step1" class="step active">

    <label>Name</label>
    <input id="name" placeholder="Hamin Y." />

    <label>Location</label>
    <select id="location">
      <option>Iloilo City</option>
      <option>Iloilo Province</option>
      <option>Outside Iloilo (can travel)</option>
    </select>

    <label>Events you're interested in</label>
    <div class="checkbox-group">
      <label class="pill">
        <input type="checkbox" value="Birthday event"> Birthday
      </label>
      <label class="pill">
        <input type="checkbox" value="Anniversary"> Anniversary
      </label>
      <label class="pill">
        <input type="checkbox" value="Watch party"> Watch party
      </label>
      <label class="pill">
        <input type="checkbox" value="Fan meet"> Fan meet
      </label>
    </div>

    <button class="primary" onclick="nextStep(2)">Next</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step">

    <label>Availability</label>
    <div class="desc">Weekends only (Saturday–Sunday)</div>

    <div id="slots">
      <div class="row">
        <select class="day">
          <option>Saturday</option>
          <option>Sunday</option>
        </select>
        <input type="time" class="start">
        <input type="time" class="end">
      </div>
    </div>

    <button class="ghost" onclick="addSlot()">+ Add another time</button>

    <button class="primary" onclick="nextStep(3)">Next</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="step">
    <div class="desc">Final step</div>

    <button class="primary" onclick="submitForm()">Submit</button>
  </div>

</div>

<!-- THANK YOU -->
<div id="thankyou">
  <h1>Thank you 💙</h1>
  <p>Your response has been recorded, PLLI.</p>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx6AH1iXNzY7IcAlA75hRL5rJ7hKFWxi5XjayFex1ZJ8EPPYkHxqNYueEUD-Z7-unQcOQ/exec";

function nextStep(step) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + step).classList.add('active');

  document.getElementById("progressText").innerText = `Step ${step} of 3`;
  document.getElementById("progressFill").style.width = (step * 33) + "%";
}

function addSlot() {
  const container = document.getElementById("slots");

  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <select class="day">
      <option>Saturday</option>
      <option>Sunday</option>
    </select>
    <input type="time" class="start">
    <input type="time" class="end">
  `;

  container.appendChild(div);
}

function submitForm() {
  const rows = document.querySelectorAll("#slots .row");

  let availability = [];

  rows.forEach(r => {
    const day = r.querySelector(".day").value;
    const start = r.querySelector(".start").value;
    const end = r.querySelector(".end").value;

    if (start && end) {
      availability.push(`${day} ${start}-${end}`);
    }
  });

  const event_interest = Array.from(
    document.querySelectorAll(".checkbox-group input:checked")
  ).map(cb => cb.value);

  const data = {
    name: document.getElementById("name").value,
    location: document.getElementById("location").value,
    event_interest: event_interest,
    availability: availability.join(", ")
  };

  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(() => {
    document.querySelector(".card").style.display = "none";
    document.getElementById("thankyou").style.display = "block";
  });
}
</script>

</body>
</html>
