<!DOCTYPE html>
<html>
<head>
  <title>PLAVE Iloilo Survey</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      padding: 40px;
      color: #1a1a1a;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h2 {
      margin-bottom: 5px;
    }

    .desc {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 15px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    .add-btn {
      background: transparent;
      color: #4f46e5;
      border: 1px dashed #4f46e5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>PLAVE Iloilo Survey 💙</h2>
    <p class="desc">Help us plan better fan events!</p>

    <label>Name</label>
    <input id="name" placeholder="Krystal L." />

    <label>Location</label>
    <select id="location">
      <option>Iloilo City</option>
      <option>Iloilo Province</option>
      <option>Outside Iloilo (can travel)</option>
      <option>Outside Iloilo (cannot)</option>
    </select>

    <label>Availability</label>
    <p class="desc">Weekends only for now</p>

    <div id="slots">
      <div class="row">
        <select class="day">
          <option>Saturday</option>
          <option>Sunday</option>
        </select>
        <input type="time" class="start">
        <input type="time" class="end">
      </div>
    </div>

    <button class="add-btn" onclick="addSlot()">+ Add another</button>

    <br><br>

    <button onclick="submitForm()">Submit</button>
  </div>

<script>
const WEB_APP_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

function addSlot() {
  const container = document.getElementById("slots");

  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <select class="day">
      <option>Saturday</option>
      <option>Sunday</option>
    </select>
    <input type="time" class="start">
    <input type="time" class="end">
  `;

  container.appendChild(div);
}

function submitForm() {
  const slots = document.querySelectorAll("#slots .row");

  let availability = [];

  slots.forEach(row => {
    const day = row.querySelector(".day").value;
    const start = row.querySelector(".start").value;
    const end = row.querySelector(".end").value;

    if (start && end) {
      availability.push(`${day} ${start}-${end}`);
    }
  });

  const data = {
    name: document.getElementById("name").value,
    location: document.getElementById("location").value,
    status: "",
    event_interest: [],
    commute: "",
    areas: "",
    support: [],
    availability: availability.join(", "),
    budget: "",
    safety: "",
    comfort: [],
    motivation: "",
    notes: ""
  };

  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => alert("Submitted 💙"));
}
</script>

</body>
</html>
