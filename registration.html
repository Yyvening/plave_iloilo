<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLI Anniversary 2026 🧺✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            background: #fff0f6; 
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            margin: 0;
            overflow-x: hidden;
        }

        .card { 
            background: white; 
            padding: 40px; border-radius: 40px; 
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.4); 
            width: 100%; max-width: 480px; text-align: center;
            border: 8px solid #ffe3ec;
            position: relative; z-index: 10;
        }

        .logo-text { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 42px; color: #ff85a2; margin-bottom: 0; }
        .sub-text { font-size: 14px; color: #ffa4ba; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        /* NEW: Event Info Section on Landing Page */
        .event-info-box {
            background: #fffafa;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
            border: 2px dashed #ffd1dc;
            display: flex;
            justify-content: space-around;
            font-family: 'Fredoka', sans-serif;
            font-size: 13px;
            color: #ff85a2;
        }
        .info-item b { display: block; color: #ffb3c1; font-size: 10px; text-transform: uppercase; }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-family: 'Fredoka', sans-serif; color: #ff85a2; font-size: 14px; margin-left: 15px; }

        input { 
            width: 100%; padding: 15px; margin-top: 5px; 
            border: 3px solid #ffe3ec; border-radius: 20px; 
            box-sizing: border-box; outline: none; background: #fffafa; color: #ff85a2;
            transition: 0.3s; font-size: 16px; font-family: 'Fredoka', sans-serif;
        }

        .btn { 
            width: 100%; padding: 18px; 
            background: #ff85a2; color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 18px; 
            font-weight: 600; font-family: 'Fredoka', sans-serif; margin-top: 15px;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 133, 162, 0.3);
        }

        /* Ticket Layout */
        #ticket-container { display: none; width: 800px; max-width: 95vw; z-index: 10; text-align: center; }
        
        .ticket {
            width: 100%; height: 380px;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            background: white;
            display: flex;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            text-align: left;
        }

        .member-img {
            position: absolute; right: -5%; top: 0;
            width: 65%; height: 100%;
            background-size: cover; 
            background-position: center 15%; 
            z-index: 1;
        }

        .fade-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, var(--m-color) 40%, var(--m-color) 55%, transparent 95%);
            z-index: 2;
        }

        .ticket-content {
            position: relative; z-index: 3;
            padding: 50px; width: 50%;
            display: flex; flex-direction: column;
            color: white;
            justify-content: space-between;
        }

        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .detail-item { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; font-weight: 600; }
        .detail-value { font-size: 15px; font-weight: 600; margin-top: 2px; }

        .member-badge {
            background: rgba(255,255,255,0.2); padding: 8px 20px;
            border-radius: 50px; font-size: 12px; font-weight: 600;
            backdrop-filter: blur(5px); display: inline-block; 
            border: 1px solid rgba(255,255,255,0.3);
        }

        .gold-glow { border: 8px solid #ffd700 !important; }
/* Mobile Responsive Adjustments */
@media screen and (max-width: 600px) {
    /* Shrink the landing page card slightly */
    .card { 
        padding: 25px; 
        width: 90%; 
    }
    
    .logo-text { font-size: 32px; }

    /* Adjust the ticket to stack vertically or shrink */
    #ticket-container { width: 95vw; }

    .ticket { 
        height: auto; 
        flex-direction: column; 
        min-height: 500px;
    }

    .ticket-content { 
        width: 100%; 
        padding: 30px; 
        box-sizing: border-box;
    }

    /* Shrink the font sizes for mobile */
    .ticket-content h2 { font-size: 24px !important; }
    #display-name { font-size: 24px !important; }
    
    .details-grid { 
        grid-template-columns: 1fr; /* Stack details in one column */
        gap: 10px; 
    }

    .member-img {
        width: 100%;
        height: 40%; /* Move image to the top or bottom half */
        position: relative;
        right: 0;
    }

    .fade-overlay {
        background: linear-gradient(to top, var(--m-color) 60%, transparent 100%);
    }
}
        @media print {
            body { background: white; }
            #ticket-container { display: block; width: 800px; }
            .btn, #form-container { display: none; }
        }
    </style>
</head>
<body>

    <!-- Landing Page -->
    <div id="form-container" class="card">
        <div class="logo-text">PLLIcnic 🧺</div>
        <div class="sub-text">Anniversary Event</div>
        
        <!-- Details now visible here! -->
        <div class="event-info-box">
            <div class="info-item"><b>Where</b>Asterum Park</div>
            <div class="info-item"><b>When</b>June 20, 2026</div>
            <div class="info-item"><b>Time</b>18:00</div>
        </div>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Your real name for registration purposes" required>
        </div>
        
        <div class="input-group">
            <label>Nickname</label>
            <input type="text" id="nickName" placeholder="Nickname for the invitation pass" required>
        </div>

        <button class="btn" onclick="pullGacha()">Check My Invitation 🎟️</button>
    </div>

    <!-- Ticket Page -->
    <div id="ticket-container">
        <div id="ticket-body" class="ticket" style="--m-color: #212121;">
            <div id="member-photo" class="member-img"></div>
            <div class="fade-overlay"></div>
            
            <div class="ticket-content">
                <div>
                    <div id="member-tag" class="member-badge">✦ MEMBER</div>
                    <h2 style="margin: 20px 0 5px 0; font-family: 'Montserrat'; font-size: 36px; line-height: 1;">PLLIcnic<br>ENTRY</h2>
                </div>

                <div class="details-grid">
                    <div><div class="detail-item">Location</div><div class="detail-value">Asterum Park</div></div>
                    <div><div class="detail-item">Date</div><div class="detail-value">June 20, 2026</div></div>
                    <div><div class="detail-item">Time</div><div class="detail-value">06:00 PM KST</div></div>
                    <div><div class="detail-item">Pass ID</div><div id="ticket-id" class="detail-value"></div></div>
                </div>

                <div style="margin-top: auto;">
                    <div class="detail-item">Authorized PLLI</div>
                    <div id="display-name" style="font-size: 32px; font-weight: 800; font-family: 'Fredoka';"></div>
                </div>
            </div>
        </div>
        <button class="btn" onclick="window.print()" style="margin-top: 25px;">Download Pass (Save as PDF) ☁️</button>
        <button class="btn" onclick="location.reload()" style="background: transparent; color: #ff85a2; border: 2px solid #ffe3ec; margin-top: 10px; font-size: 12px; padding: 10px;">Back to Entrance</button>
    </div>

    <script>
        const gachaPool = [
            { name: "Yejun", color: "#00b0ff", img: "https://lh3.googleusercontent.com/u/0/d/14sLTCqSuNLolAuBav8ZQzaAyEzvYKowk" },
            { name: "Noah", color: "#9c27b0", img: "https://lh3.googleusercontent.com/u/0/d/1bN_jEuWfTTAP8_wh7lIq2Q4h_qIAITEV" },
            { name: "Bamby", color: "#f06292", img: "https://lh3.googleusercontent.com/u/0/d/1SPsMIsrSgRuHSfQYUjpps7WlTjPXScpa" },
            { name: "Eunho", color: "#e53935", img: "https://lh3.googleusercontent.com/u/0/d/1XE-9iK_sJCz3qXSs-3hLIz72BfWd-0cQ" },
            { name: "Hamin", color: "#121212", img: "https://lh3.googleusercontent.com/u/0/d/10DQpAQ_tpimS3i9kgzUrClLAjZrt2beR" },
            { name: "PLAVE (Group)", color: "#4a148c", img: "https://lh3.googleusercontent.com/u/0/d/1RAlKHD8n_DaSdyu0Add2RWt0qFHIqn4I" }
        ];

        function pullGacha() {
            const fullName = document.getElementById('fullName').value;
            const nickName = document.getElementById('nickName').value;
            if (!fullName || !nickName) return alert("Please fill in both fields! ♡");

            let result;
            const chance = Math.random();
            if (chance < 0.10) { result = gachaPool[5]; } 
            else { result = gachaPool[Math.floor(Math.random() * 5)]; }

            const ticket = document.getElementById('ticket-body');
            const photo = document.getElementById('member-photo');
            const tag = document.getElementById('member-tag');
            
            ticket.style.setProperty('--m-color', result.color);
            photo.style.backgroundImage = `url('${result.img}')`;
            
            if (result.name === "PLAVE (Group)") {
                ticket.classList.add('gold-glow');
                tag.innerText = "✨ FULL GROUP ✨";
            } else {
                ticket.classList.remove('gold-glow');
                tag.innerText = "✦ " + result.name.toUpperCase();
            }
            
            document.getElementById('display-name').innerText = nickName.toUpperCase();
            document.getElementById('ticket-id').innerText = 'PLLI-' + Math.floor(1000 + Math.random() * 9000);

            document.getElementById('form-container').style.display = 'none';
            document.getElementById('ticket-container').style.display = 'block';
        }
    </script>
</body>
</html>
