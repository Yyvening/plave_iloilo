<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLI Anniversary ✨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            background: #fff0f6; 
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            margin: 0; padding: 20px;
            box-sizing: border-box;
        }

        /* --- REGISTRATION PAGE AUDIT --- */
        .card { 
            background: white; 
            padding: 40px; border-radius: 40px; 
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.3); 
            width: 100%; max-width: 420px; text-align: center;
            border: 8px solid #ffe3ec; /* Slightly darker for visibility */
        }

        .logo-text { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px; color: #ff8fab; margin-bottom: 5px; }
        .sub-text { font-size: 16px; color: #ffb3c1; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }

        .event-info-box {
            background: #fffafa; border-radius: 20px; padding: 20px; margin-bottom: 25px;
            border: 2px dashed #ffb3c1; display: flex; justify-content: space-around;
            font-family: 'Fredoka', sans-serif; font-size: 13px; color: #ff8fab; /* Darkened text color */
        }
        .info-item b { display: block; color: #ffb3c1; font-size: 11px; text-transform: uppercase; margin-bottom: 2px; }

        .name-row { display: flex; gap: 12px; margin-top: 10px; }

        input { 
            width: 100%; padding: 16px; margin-top: 10px; 
            border: 3px solid #ffe3ec; border-radius: 20px; 
            box-sizing: border-box; outline: none; background: #fff; color: #ff8fab;
            font-size: 16px; font-family: 'Fredoka', sans-serif;
        }
        input::placeholder { color: #ffc2d1; }

        .btn { 
            width: 100%; padding: 18px; background: #ff8fab; color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 20px; font-weight: 600;
            font-family: 'Fredoka', sans-serif; margin-top: 15px; transition: 0.3s;
        }
        .btn:hover { background: #ff7597; transform: translateY(-2px); }

        /* --- TICKET SYSTEM --- */
        #ticket-container { display: none; width: 100%; max-width: 800px; text-align: center; }
        
        #capture-area { width: 100%; margin-bottom: 20px; }

        .ticket {
            width: 100%; aspect-ratio: 2/3.5; border-radius: 40px; position: relative;
            overflow: hidden; background: white; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); text-align: left;
            display: flex; flex-direction: column;
        }

        .member-img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center 15%; z-index: 1;
        }

        .fade-overlay {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(to top, 
                var(--m-color) 0%, 
                var(--m-color) 25%, 
                transparent 35%);
        }

        .ticket-content {
            position: relative; z-index: 3; padding: 30px; 
            height: 100%; display: flex; flex-direction: column;
            justify-content: flex-end; color: #444; box-sizing: border-box;
        }

        /* --- DESKTOP LAYOUT (Horizontal) --- */
        @media screen and (min-width: 800px) {
            #ticket-container { max-width: 800px; }
            .ticket { aspect-ratio: 800/380; flex-direction: row; }
            .member-img { width: 70%; left: 30%; background-position: right center; }
            .fade-overlay {
                background: linear-gradient(to right, 
                    var(--m-color) 25%, 
                    var(--m-color) 35%, 
                    transparent 65%);
            }
            .ticket-content { width: 50%; justify-content: space-between; padding: 40px 50px; }
            .details-grid { margin-top: 10px; }
        }

        /* --- SHARED STYLES --- */
        .group-mode .fade-overlay { 
            background: linear-gradient(to top, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 25%, transparent 40%);
        }
        @media screen and (min-width: 800px) {
            .group-mode .fade-overlay {
                background: linear-gradient(to right, rgba(255,255,255,0.95) 25%, rgba(255,255,255,0.85) 35%, transparent 65%);
            }
        }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .detail-item { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; font-weight: 600; }
        .detail-value { font-size: 14px; font-weight: 600; margin-top: 2px; }

        .member-badge {
            background: rgba(255,255,255,0.8); padding: 6px 18px; border-radius: 50px;
            font-size: 12px; font-weight: 600; backdrop-filter: blur(5px);
            display: inline-block; border: 1px solid rgba(255,255,255,0.4);
            margin-bottom: 10px; color: #ff8fab;
        }

        #display-name { font-size: 36px; font-weight: 800; font-family: 'Fredoka'; line-height: 1; }
    </style>
</head>
<body>

    <div id="form-container" class="card">
        <div class="logo-text">PLLIcnic 🧺</div>
        <div class="sub-text">Anniversary Event</div>
        
        <div class="event-info-box">
            <div class="info-item"><b>Where</b>Asterum Park</div>
            <div class="info-item"><b>When</b>June 20, 2026</div>
            <div class="info-item"><b>Time</b>4:00 PM</div>
        </div>

        <div class="name-row">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
        </div>

        <button class="btn" onclick="pullGacha()">Register & Check Pass 🎟️</button>
    </div>

    <div id="ticket-container">
        <div id="capture-area">
            <div id="ticket-body" class="ticket" style="--m-color: #ffffff;">
                <div id="member-photo" class="member-img"></div>
                <div id="overlay" class="fade-overlay"></div>
                
                <div class="ticket-content">
                    <div>
                        <div id="member-tag" class="member-badge">✦ MEMBER</div>
                        <h2 style="margin: 0; font-family: 'Montserrat'; font-size: 32px; line-height: 1;">Picnic Pass</h2>
                    </div>

                    <div class="details-grid">
                        <div><div class="detail-item">Location</div><div class="detail-value">Asterum Park</div></div>
                        <div><div class="detail-item">Pass ID</div><div id="ticket-id" class="detail-value"></div></div>
                        <div><div class="detail-item">Date</div><div class="detail-value">June 20, 2026</div></div>
                        <div><div class="detail-item">Time</div><div class="detail-value">04:00 PM</div></div>
                    </div>

                    <div style="margin-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 15px;">
                        <div class="detail-item">Authorized PLLI</div>
                        <div id="display-name"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="downloadImage()">Download PNG 📸</button>
            <button class="btn" onclick="location.reload()" style="background: transparent; color: #ff8fab; border: 2px solid #ffb3c1; margin-top: 15px; font-size: 16px;">Try Again</button>
        </div>
    </div>

    <script>
        const gachaPool = [
            { name: "Yejun", color: "#e1f5fe", img: "https://lh3.googleusercontent.com/u/0/d/1f_5pCcNu6yWJIZoanqRMGBoVPJY33Cke" },
            { name: "Noah", color: "#f3e5f5", img: "https://lh3.googleusercontent.com/u/0/d/136FYbU-u4U0Cw8AJQKYUfzpzNQrMDKhW" },
            { name: "Bamby", color: "#fce4ec", img: "https://lh3.googleusercontent.com/u/0/d/1X9VM3HhF8cYvU6A6k0jXGEEaK6JpGZQ7" },
            { name: "Eunho", color: "#ffebee", img: "https://lh3.googleusercontent.com/u/0/d/1IcBszLi_zV2Hrw2BxxaGqFn4rjJBulGa" },
            { name: "Hamin", color: "#f1f8e9", img: "https://lh3.googleusercontent.com/u/0/d/1K21sm_dz9BgkXesEJEuPZn8MyQ0Tjr9K" },
            { name: "PLAVE (Group)", color: "#ffffff", img: "https://lh3.googleusercontent.com/u/0/d/1pVg2CfjS-7elfpIfvyCT_oV_QaYPZDy9" }
        ];

        function pullGacha() {
            const first = document.getElementById('firstName').value.trim();
            const last = document.getElementById('lastName').value.trim();
            if (!first || !last) return alert("Please provide both names! ♡");

            const result = gachaPool[Math.floor(Math.random() * gachaPool.length)];
            const ticket = document.getElementById('ticket-body');
            const photo = document.getElementById('member-photo');
            const tag = document.getElementById('member-tag');
            
            ticket.style.setProperty('--m-color', result.color);
            photo.style.backgroundImage = `url('${result.img}')`;
            
            if (result.name === "PLAVE (Group)") {
                ticket.classList.add('group-mode');
                tag.innerText = "✨ FULL GROUP ✨";
            } else {
                ticket.classList.remove('group-mode');
                tag.innerText = "✦ " + result.name.toUpperCase();
            }
            
            document.getElementById('display-name').innerText = first.toUpperCase();
            document.getElementById('ticket-id').innerText = 'PLLI-' + Math.floor(1000 + Math.random() * 9000);

            document.getElementById('form-container').style.display = 'none';
            document.getElementById('ticket-container').style.display = 'block';
        }

        function downloadImage() {
            const container = document.getElementById('capture-area');
            const firstName = document.getElementById('firstName').value;

            html2canvas(container, {
                useCORS: true,
                backgroundColor: null,
                scale: 3 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `PLLIcnic_Pass_${firstName}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
