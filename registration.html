<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLI Anniversary ✨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            background: #fff0f6; 
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- LANDING PAGE --- */
        .card { 
            background: white; 
            padding: 40px; border-radius: 40px; 
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.2); 
            width: 90%; max-width: 480px; text-align: center;
            border: 8px solid #fff0f6;
            position: relative; z-index: 10;
        }

        .logo-text { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 42px; color: #ffb3c1; margin-bottom: 0; }
        .sub-text { font-size: 14px; color: #ffd1dc; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        .event-info-box {
            background: #fffafa; border-radius: 20px; padding: 15px; margin-bottom: 25px;
            border: 2px dashed #ffe3ec; display: flex; justify-content: space-around;
            font-family: 'Fredoka', sans-serif; font-size: 13px; color: #ffb3c1;
        }
        .info-item b { display: block; color: #ffd1dc; font-size: 10px; text-transform: uppercase; }

        .name-row { display: flex; gap: 10px; margin-top: 10px; }

        input { 
            width: 100%; padding: 15px; margin-top: 10px; 
            border: 3px solid #fff0f6; border-radius: 20px; 
            box-sizing: border-box; outline: none; background: #fffafa; color: #ffb3c1;
            transition: 0.3s; font-size: 16px; font-family: 'Fredoka', sans-serif;
        }

        .btn { 
            width: 100%; padding: 18px; background: #ffb3c1; color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 18px; font-weight: 600;
            font-family: 'Fredoka', sans-serif; margin-top: 15px; transition: 0.3s;
        }

        /* --- TICKET LAYOUT (FORCED HORIZONTAL) --- */
        #ticket-container { display: none; width: 800px; max-width: 95vw; z-index: 10; text-align: center; }
        
        #capture-area {
            width: 800px;
            margin: 0 auto;
        }

        .ticket {
            width: 800px; height: 380px; border-radius: 40px; position: relative;
            overflow: hidden; background: white; display: flex;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); text-align: left;
            -webkit-print-color-adjust: exact;
        }

        .member-img {
            position: absolute; right: 0; top: 0; width: 70%; height: 100%;
            background-size: cover; background-position: right center; z-index: 1;
        }

        .fade-overlay {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(to right, 
                var(--m-color) 25%, 
                var(--m-color) 35%, 
                transparent 65%);
        }

        .ticket-content {
            position: relative; z-index: 3; padding: 40px 50px 30px 50px; 
            width: 50%; height: 100%; display: flex; flex-direction: column;
            justify-content: space-between; color: #555; box-sizing: border-box;
        }

        .group-mode .member-img { width: 100%; background-position: center; }
        .group-mode .fade-overlay { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(1px); }
        .group-mode .ticket-content { color: #444; width: 100%; }

        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .detail-item { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; font-weight: 600; }
        .detail-value { font-size: 15px; font-weight: 600; margin-top: 2px; }

        .member-badge {
            background: rgba(255,255,255,0.4); padding: 8px 20px; border-radius: 50px;
            font-size: 12px; font-weight: 600; backdrop-filter: blur(5px);
            display: inline-block; border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- MOBILE SCALE-DOWN --- */
        @media screen and (max-width: 820px) {
            /* Instead of stacking, we shrink the entire container to fit the screen width */
            #ticket-container { width: 100%; }
            #capture-area { 
                transform: scale(calc(100vw / 850)); /* Dynamically scale the 800px ticket to fit screen */
                transform-origin: top center;
                width: 800px; /* Keep internal width consistent for scaling */
            }
            .btn-group { margin-top: -150px; } /* Adjust button position after scaling */
        }
    </style>
</head>
<body>

    <div id="form-container" class="card">
        <div class="logo-text">PLLIcnic 🧺</div>
        <div class="sub-text">Anniversary Event</div>
        
        <div class="event-info-box">
            <div class="info-item"><b>Where</b>Asterum Park</div>
            <div class="info-item"><b>When</b>June 20, 2026</div>
            <div class="info-item"><b>Time</b>4:00 PM</div>
        </div>

        <div class="name-row">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
        </div>

        <button class="btn" onclick="pullGacha()">Register & Check Pass 🎟️</button>
    </div>

    <div id="ticket-container">
        <div id="capture-area">
            <div id="ticket-body" class="ticket" style="--m-color: #ffffff;">
                <div id="member-photo" class="member-img"></div>
                <div id="overlay" class="fade-overlay"></div>
                
                <div class="ticket-content">
                    <div>
                        <div id="member-tag" class="member-badge">✦ MEMBER</div>
                        <h2 style="margin: 20px 0 5px 0; font-family: 'Montserrat'; font-size: 36px; line-height: 1;">Picnic<br>Pass</h2>
                    </div>

                    <div class="details-grid">
                        <div><div class="detail-item">Location</div><div class="detail-value">Asterum Park</div></div>
                        <div><div class="detail-item">Date</div><div class="detail-value">June 20, 2026</div></div>
                        <div><div class="detail-item">Time</div><div class="detail-value">04:00 PM</div></div>
                        <div><div class="detail-item">Pass ID</div><div id="ticket-id" class="detail-value"></div></div>
                    </div>

                    <div style="margin-top: auto; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 10px;">
                        <div class="detail-item">Authorized PLLI</div>
                        <div id="display-name" style="font-size: 32px; font-weight: 800; font-family: 'Fredoka'; line-height: 1.1;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="downloadImage()">Download as Image (PNG) 📸</button>
            <button class="btn" onclick="window.print()" style="background: #ffd1dc;">Save as PDF ☁️</button>
            <button class="btn" onclick="location.reload()" style="background: transparent; color: #ffb3c1; border: 2px solid #fff0f6; margin-top: 10px; font-size: 12px; padding: 10px;">Back to Registration</button>
        </div>
    </div>

    <script>
        const gachaPool = [
            { name: "Yejun", color: "#96CCFF", img: "https://lh3.googleusercontent.com/u/0/d/1f_5pCcNu6yWJIZoanqRMGBoVPJY33Cke" },
            { name: "Noah", color: "#DFABFF", img: "https://lh3.googleusercontent.com/u/0/d/136FYbU-u4U0Cw8AJQKYUfzpzNQrMDKhW" },
            { name: "Bamby", color: "#FFB8D3", img: "https://lh3.googleusercontent.com/u/0/d/1X9VM3HhF8cYvU6A6k0jXGEEaK6JpGZQ7" },
            { name: "Eunho", color: "#FFBABA", img: "https://lh3.googleusercontent.com/u/0/d/1IcBszLi_zV2Hrw2BxxaGqFn4rjJBulGa" },
            { name: "Hamin", color: "#ABFFBD", img: "https://lh3.googleusercontent.com/u/0/d/1K21sm_dz9BgkXesEJEuPZn8MyQ0Tjr9K" },
            { name: "PLAVE (Group)", color: "#ffffff", img: "https://lh3.googleusercontent.com/u/0/d/1pVg2CfjS-7elfpIfvyCT_oV_QaYPZDy9" }
        ];

        function pullGacha() {
            const first = document.getElementById('firstName').value.trim();
            const last = document.getElementById('lastName').value.trim();
            if (!first || !last) return alert("Please provide both names! ♡");

            const result = gachaPool[Math.floor(Math.random() * gachaPool.length)];
            const ticket = document.getElementById('ticket-body');
            const photo = document.getElementById('member-photo');
            const tag = document.getElementById('member-tag');
            
            ticket.style.setProperty('--m-color', result.color);
            photo.style.backgroundImage = `url('${result.img}')`;
            
            if (result.name === "PLAVE (Group)") {
                ticket.classList.add('group-mode');
                tag.innerText = "✨ FULL GROUP ✨";
            } else {
                ticket.classList.remove('group-mode');
                tag.innerText = "✦ " + result.name.toUpperCase();
            }
            
            document.getElementById('display-name').innerText = first.toUpperCase();
            document.getElementById('ticket-id').innerText = 'PLLI-' + Math.floor(1000 + Math.random() * 9000);

            document.getElementById('form-container').style.display = 'none';
            document.getElementById('ticket-container').style.display = 'block';
        }

        function downloadImage() {
            const container = document.getElementById('capture-area');
            const firstName = document.getElementById('firstName').value;

            // Temporary reset of scale for clean capture
            const originalTransform = container.style.transform;
            container.style.transform = 'none';

            html2canvas(container, {
                useCORS: true,
                backgroundColor: null,
                scale: 2 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `PLLIcnic_Pass_${firstName}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                container.style.transform = originalTransform;
            });
        }
    </script>
</body>
</html>
